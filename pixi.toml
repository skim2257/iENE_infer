[project]
name = "iENE_infer"
version = "0.1.0"
channels = ["pytorch", "conda-forge"]
platforms = ["win-64", "linux-64", "osx-64"]

[pypi-dependencies]
iENE_infer = { path = ".", editable = true }
med-imagetools = ">=1.2.0.2,<2"
acsconv = "==0.1.0"
torch = "==1.8.0"
torchvision = "==0.9.0"
pytorch-lightning = "==1.6.0"
torchio = "==0.18.86"

[dependencies]
python = "3.9.*"
pandas = "==1.4.2"
scikit-learn = ">=1.5.2,<2"
python-dotenv = ">=1.0.1,<2"

[activation.env]
data_root="/data/input"
IN_PATH="/data/processed"
IN_ORG_PATH="/data/organized"
OUT_PATH="/data/segmentations"
pred_save_path="/data/outputs/predictions.csv"
ckpt_path="/app/src/models"

[feature.nnunet.activation.env]
IN_ORG_PATH="/data/organized"
OUT_PATH="/data/segmentations"

[feature.nnunet]
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["win-64", "linux-64"]

[feature.nnunet.dependencies]
python = "3.10.*"
numpy = "1.24.3.*"
pytorch = "2.0.*"
pytorch-cuda = "11.8.*"

[feature.nnunet.pypi-dependencies]
nnunetv2 = "*"
acvl-utils = "==0.2"
blosc2 = "==2.7.1"

[feature.nnunet.tasks]
larynx = { cmd = "nnUNetv2_predict -i $IN_ORG_PATH -o $OUT_PATH -d 001 -device cuda -f 0 -c 3d_fullres -chk checkpoint_best.pth", env = {nnUNet_raw="./src/nnunet/nnUNet_raw", nnUNet_results="./src/nnunet/nnUNet_results", nnUNet_preprocessed="./src/nnunet/nnUNet_preprocessed"}} 

[tasks]
# Step 0: DICOM to NIfTI preprocessing (optional)
process = { cmd = "autopipeline $data_root $IN_PATH --modalities CT"}

# Step 1: Prepare data for nnUNet
prepare = { cmd = "python src/iENE_infer/prepare.py $IN_PATH $IN_ORG_PATH"}

# Step 2: Run larynx segmentation
# Use: pixi run -e nnunet larynx

# Step 3: Run iENE prediction
predict = { cmd = "python src/iENE_infer/predict.py --test_root $IN_ORG_PATH --test_mask $OUT_PATH --pred_save_path $PRED_SAVE_PATH --num_workers 2 --batch_size 1 --arch acs --seed 1201 --input_size 256 256 128 --pretrained --resnet resnet18 --ckpt_path $MODEL_DIR_PATH" }

# Step 4: Average predictions
average = { cmd = "python src/iENE_infer/average.py --prediction_dir $PRED_SAVE_PATH" }

# Combined tasks for convenience
inference = { depends-on = ["predict", "average"] }
pipeline-no-dicom = { cmd = "pixi run prepare && pixi run -e nnunet larynx && pixi run predict && pixi run average" }
pipeline-full = { cmd = "pixi run process && pixi run prepare && pixi run -e nnunet larynx && pixi run predict && pixi run average" }
predict-only = { cmd = "pixi run predict && pixi run average" }

validate = {cmd = "python src/iENE_infer/validate_data.py $IN_ORG_PATH"}

[environments]
nnunet = { features = ["nnunet"], no-default-feature = true }