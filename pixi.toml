[project]
name = "iENE_infer"
version = "0.1.0"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["win-64", "linux-64"]

[pypi-dependencies]
iENE_infer = { path = ".", editable = true }
med-imagetools = ">=1.2.0.2,<2"
torch = { version = "==1.8.0", index = "https://download.pytorch.org/whl/cu111"}
torchvision = { version = "==0.9.0", index = "https://download.pytorch.org/whl/cu111"}
acsconv = "==0.1.0"
pytorch-lightning = "==1.6.0"
torchio = "==0.18.86"

[dependencies]
cudatoolkit = "11.1.*"
python = "3.9.*"
pandas = "==1.4.2"
scikit-learn = ">=1.5.2,<2"
python-dotenv = ">=1.0.1,<2"
numpy = ">=1.23"

[activation.env]
SAVE_DIR="C:/Users/samkr/OneDrive/Desktop/tcia/radcure-from-h4h"
IN_PATH="C:/Users/samkr/OneDrive/Desktop/tcia/radcure-h4h-processed"
IN_ORG_PATH="C:/Users/samkr/OneDrive/Desktop/tcia/hn1-clone-replication/hn1_reorg"
OUT_PATH="C:/Users/samkr/OneDrive/Desktop/tcia/hn1-clone-replication/hn1_nnunet"
PRED_SAVE_PATH="./outputs_hn1/HN1_h4h_predictions.csv"
ckpt_path="./src/models"
KMP_DUPLICATE_LIB_OK="TRUE"

[feature.nnunet.activation.env]
IN_ORG_PATH="C:/Users/samkr/OneDrive/Desktop/tcia/hn1-clone-replication/hn1_reorg"
OUT_PATH="C:/Users/samkr/OneDrive/Desktop/tcia/hn1-clone-replication/hn1_nnunet"
nnUNet_raw="./src/nnunet/nnUNet_raw"
nnUNet_results="./src/nnunet/nnUNet_results"
nnUNet_preprocessed="./src/nnunet/nnUNet_preprocessed"


[feature.download.activation.env]
SAVE_DIR="C:/Users/samkr/OneDrive/Desktop/tcia/radcure-from-h4h"
TCIA_USERNAME="bhaibeka"
TCIA_PASSWORD="Soleil2uhn!"
IENE_CSV_PATH="C:/Users/samkr/OneDrive/Desktop/code/iENE_infer_new/iENE.csv"

[feature.download.dependencies]
python = "3.12.*"
joblib = ">=1.5.1,<2"

[feature.download.pypi-dependencies]
nbiatoolkit = ">=1.3.1, <2"

[feature.gpu]
channels = ["nvidia", "conda-forge"]

[feature.gpu.dependencies]
cuda-toolkit = "12.6.*"

[feature.gpu.pypi-dependencies]
torch = { version =  ">=2.0.0,<3.0.0", index = "https://download.pytorch.org/whl/cu126"}

[feature.cpu.pypi-dependencies]
torch = { version = ">=2.0.0,<3.0.0", index = "https://download.pytorch.org/whl/cpu"}

[feature.nnunet.dependencies]
python = "3.10.*"
numpy = "1.24.3.*"

[feature.nnunet.pypi-dependencies]
nnunetv2 = ">=2.0.0,<3.0.0"
acvl-utils = "==0.2"
blosc2 = "==2.7.1"

[feature.nnunet.tasks]
larynx = { cmd = "CUDA_VISIBLE_DEVICES=0 nnUNetv2_predict -i $IN_ORG_PATH -o $OUT_PATH -d 001 -device cuda -f 0 -c 3d_fullres -chk checkpoint_best.pth"} 

[tasks]
# Step 0: DICOM to NIfTI preprocessing (optional)
process = { cmd = "autopipeline $SAVE_DIR $IN_PATH --modalities CT"}

# Step 1: Prepare data for nnUNet
prepare = { cmd = "python src/iENE_infer/prepare.py $IN_PATH $IN_ORG_PATH"}

# Step 2: Run larynx segmentation
# Use: pixi run -e nnunet larynx

# Step 3: Run iENE prediction
predict = { cmd = "python src/iENE_infer/predict.py --test_root $IN_ORG_PATH --test_mask $OUT_PATH --pred_save_path $PRED_SAVE_PATH --num_workers 0 --batch_size 1 --arch acs --seed 1201 --input_size 256 256 128 --pretrained --resnet resnet18 --gpus 1 --ckpt_path ./src/models" }

# Step 4: Average predictions
average = { cmd = "python src/iENE_infer/average.py --prediction_dir $PRED_SAVE_PATH" }

# Combined tasks for convenience
pipeline-no-dicom = { cmd = "pixi run prepare && pixi run -e nnunet larynx && pixi run predict && pixi run average" }
pipeline-no-org = { cmd = "pixi run -e nnunet larynx && pixi run predict && pixi run average" }
pipeline = { cmd = "pixi run process && pixi run prepare && pixi run -e nnunet larynx && pixi run predict && pixi run average" }
inference = [{ task = "predict" }, { task = "average" }]

# Health check task
health-check = { cmd = "python -c 'import torch; print(f\"PyTorch CPU: {torch.get_num_threads()} threads\"); print(f\"CUDA available: {torch.cuda.is_available()}\")'" }

[environments]
tcia = { features = ["download"], no-default-feature = true }
nnunet = { features = ["gpu", "nnunet"], no-default-feature = true }
nnunet-cpu = { features = ["cpu", "nnunet"], no-default-feature = true }
